services:
  order-postgres:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      POSTGRES_USER: ${ORDER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD}
    ports:
      - "${ORDER_POSTGRES_HOST_PORT}:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orders"]
      interval: 2s
      timeout: 2s
      retries: 15

  order-migrations:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    env_file:
      - .env
    depends_on:
      order-postgres:
        condition: service_healthy
    command:
      - -dir
      - /migrations
      - postgres
      - ${ORDER_POSTGRES_URL}
      - up

volumes:
  order-postgres-data:
