services:
  order-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: order
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orders"]
      interval: 2s
      timeout: 2s
      retries: 15

  order-migrations:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    depends_on:
      order-postgres:
        condition: service_healthy
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://order:secret@order-postgres:5432/orders?sslmode=disable
      - up

volumes:
  order-postgres-data:
