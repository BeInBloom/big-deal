openapi: 3.0.3

info:
  title: OrderService API
  description: API сервиса заказов на постройку космических кораблей
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: /
    description: Default server

security: []

tags:
  - name: Orders
    description: Управление заказами

paths:
  /api/v1/orders:
    $ref: './paths/orders.yaml'

  /api/v1/orders/{order_uuid}:
    $ref: './paths/order-by-uuid.yaml'

  /api/v1/orders/{order_uuid}/pay:
    $ref: './paths/pay-order.yaml'

  /api/v1/orders/{order_uuid}/cancel:
    $ref: './paths/cancel-order.yaml'
