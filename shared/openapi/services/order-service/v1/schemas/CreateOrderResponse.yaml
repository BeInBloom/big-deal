type: object
required:
  - order_uuid
  - total_price
properties:
  order_uuid:
    type: string
    format: uuid
    description: UUID созданного заказа
    example: 333e8400-e29b-41d4-a716-446655440003
  total_price:
    type: number
    format: double
    description: Итоговая стоимость заказа
    example: 123.45
