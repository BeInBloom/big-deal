type: object
required:
  - code
  - message
properties:
  code:
    type: string
    description: Машиночитаемый код ошибки
    example: ORDER_NOT_FOUND
  message:
    type: string
    description: Человекочитаемое описание ошибки
    example: Order not found
  details:
    type: object
    nullable: true
    additionalProperties: true
    description: Дополнительная информация об ошибке
